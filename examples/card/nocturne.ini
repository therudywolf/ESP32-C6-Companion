; Nocturne C6 — optional overrides, read once at boot from the SD card root.
;
; secrets.h stays the source of truth: this file only OVERRIDES, key by key,
; and anything you leave out keeps its compiled value. A missing or malformed
; file changes nothing at all.
;
; The point is that WiFi and the server address stop being compile-time. Take
; the board somewhere else, edit two lines on any laptop, put the card back.
;
; NOTE: this puts a WiFi password in the clear on removable media. That is the
; trade for editing it without a toolchain — fine for your own card in your own
; device, worth thinking about before it goes into a machine you don't control.

[wifi]
; up to 5 networks; the board scans and picks the strongest it can see
ssid1 = HomeAP
pass1 = your-password
ssid2 = PhoneHotspot
pass2 = another-password

[server]
; the PC running the Nocturne telemetry server
host  = 192.168.1.2
port  = 8888
panel = 8899          ; control panel, used for album art
; A hub on a public host (python -m hub, hub/deploy) refuses a link that
; does not open with `HELO <token>`; set the same string as board_token
; in its config.json. The console command `server <host> [port] [token]`
; writes this whole section for you - no card reader needed.
; token = change-me

[llm]
; LM Studio for the wolf's voice. A card endpoint is tried FIRST and the
; compiled ones remain as fallbacks, so a wrong line here degrades to the old
; behaviour instead of muting the wolf.
endpoint = http://192.168.1.2:1234
model    = google/gemma-4-e2b
; key    = sk-lm-...

[alarm]
; The board has a clock, a light and something that talks. One shot per day.
; at = 07:30

[zigbee]
; Names for paired sensors, in join order. Shown on the ПОГОДА tile and sent
; upstream in zbs: lines - no commas. Omit for "датчик N".
; name1 = Спальня
; name2 = Балкон

[pet]
; The companion's name, whatever its kind (Меню → Питомец → Вид picks wolf /
; dog / cat / fox). Omit for the built-in one: Ноктюрн, Хати, Тень, Рыжик.
; name = Бублик
; /skins/<name>.wolf — 512 raw bytes: four 128-byte 32x32 XBM frames in the
; order idle, blink, aggressive, funny. Omit for the built-in sprite.
; skin = winter
; ([wolf] is still accepted for both keys.)
