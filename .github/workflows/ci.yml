name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The real secrets.h is gitignored and the binary bakes it in, so CI
      # builds against the committed example. This proves the tree compiles;
      # it is not a flashable image.
      - name: Stub secrets
        run: cp include/secrets.h.example include/secrets.h

      - name: Wire schema check
        run: python tools/check_schema.py

      - name: Theme contrast check
        run: python tools/check_contrast.py

      - name: Host unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run -e nocturne-c6

      # One 3.62 MB app partition (the Zigbee coordinator took the OTA slots).
      # Fail loudly BEFORE the image stops fitting.
      - name: Check app partition headroom
        run: |
          size=$(stat -c%s .pio/build/nocturne-c6/firmware.bin)
          limit=$((3801088))
          pct=$((size * 100 / limit))
          echo "firmware $size B = ${pct}% of a $limit B app slot"
          if [ "$pct" -gt 90 ]; then
            echo "::error::firmware is ${pct}% of the OTA partition - shrink it or repartition"
            exit 1
          fi
