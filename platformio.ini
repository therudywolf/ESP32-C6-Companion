; Nocturne C6 — wolf companion for Waveshare ESP32-C6-LCD-1.47 (172x320 ST7789).
; Port of Nocturne OS PC Companion (Heltec ESP32-S3) to color LCD + LLM pet.
;
; Build:   pio run
; Upload:  pio run -t upload                    (USB-Serial/JTAG, see upload_port)
; OTA:     pio run -t upload --upload-port <ip> (device IP is on the СИСТЕМА screen)
; Monitor: pio device monitor
; Tests:   pio test -e native                   (host-side, no board needed)
;
; NOTE: official platform-espressif32 ships Arduino core 2.x with NO ESP32-C6
; support. We pin the pioarduino fork (Arduino 3.x on IDF 5.x, full C6).

[env:nocturne-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; ESP32-C6FH4: 4MB in-package flash (product page "FH8" is a typo), no PSRAM.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; OTA-capable layout: two 1.875 MB app slots (image is ~1.5 MB). NVS keeps the
; offset/size it had under huge_app.csv, so the wolf's saved state survives the
; switch. Watch the app-partition percentage — there is ~350 KB of headroom.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L

monitor_speed = 115200
monitor_port = COM3
upload_port = COM3
monitor_filters = esp32_exception_decoder, time

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I include
    -I src
    -Wall

lib_ldf_mode = chain
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bblanchon/ArduinoJson @ ^7.0.3
    olikraus/U8g2 @ ^2.35.9   ; font data only (Cyrillic); no U8g2 display object

; Host-side unit tests for the pure logic that has actually shipped bugs:
; UTF-8 clipping, glyph filtering, the ring buffers. `test/arduino_shim` supplies
; the sliver of the Arduino API those headers touch, so nothing device-specific
; has to be stubbed.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I test/arduino_shim
    -I src
    -I include
    -Wall
